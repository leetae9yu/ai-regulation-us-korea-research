<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 규제 연구 아카이브 렌더 QA</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; background: #f5f7fa; color: #1f2937; font-family: "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif; line-height: 1.65; }
    header { position: sticky; top: 0; z-index: 2; display: flex; gap: 8px; align-items: center; padding: 12px 20px; background: #14213d; color: #fff; }
    header strong { margin-right: auto; }
    button { border: 1px solid #92a1ba; border-radius: 6px; padding: 7px 11px; background: #fff; color: #14213d; cursor: pointer; }
    button[aria-current="true"] { background: #cfe2ff; font-weight: 700; }
    main { box-sizing: border-box; max-width: 1040px; margin: 28px auto; padding: 48px 64px; background: #fff; border: 1px solid #d0d7de; border-radius: 12px; }
    h1, h2, h3, h4 { line-height: 1.3; word-break: keep-all; }
    h1, h2 { border-bottom: 1px solid #d8dee4; padding-bottom: .3em; }
    p, li { word-break: keep-all; overflow-wrap: break-word; }
    table { display: block; width: 100%; overflow-x: auto; border-collapse: collapse; }
    th, td { border: 1px solid #d0d7de; padding: 8px 10px; text-align: left; }
    th { background: #f6f8fa; }
    img { display: block; max-width: 100%; height: auto; margin: 24px auto; }
    blockquote { margin: 16px 0; padding: 8px 16px; color: #59636e; border-left: 4px solid #0969da; background: #f6f8fa; }
    code { background: #eff1f3; border-radius: 4px; padding: .15em .35em; }
    pre { overflow-x: auto; background: #f6f8fa; padding: 16px; border-radius: 8px; }
    a { color: #0969da; }
    @media (max-width: 760px) {
      header { flex-wrap: wrap; }
      header strong { width: 100%; }
      main { margin: 0; padding: 24px 18px; border: 0; border-radius: 0; }
    }
  </style>
</head>
<body>
  <header>
    <strong>날짜별 연구보고서 QA</strong>
    <button data-path="../README.md" aria-current="true">인덱스</button>
    <button data-path="../260901/REPORT.md">260901</button>
    <button data-path="../260902/REPORT.md">260902</button>
  </header>
  <main id="content" aria-live="polite">문서를 불러오는 중…</main>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: false, theme: "neutral" });
    async function render(path, button) {
      document.body.dataset.ready = "false";
      const markdown = await (await fetch(path)).text();
      const base = new URL(path, location.href);
      document.querySelector("#content").innerHTML = marked.parse(markdown);
      document.querySelectorAll("#content img").forEach((image) => {
        image.src = new URL(image.getAttribute("src"), base).href;
      });
      document.querySelectorAll("pre code.language-mermaid").forEach((code) => {
        const holder = document.createElement("div");
        holder.className = "mermaid";
        holder.textContent = code.textContent;
        code.parentElement.replaceWith(holder);
      });
      document.querySelectorAll("button").forEach((item) => item.removeAttribute("aria-current"));
      button.setAttribute("aria-current", "true");
      await mermaid.run({ querySelector: ".mermaid" });
      document.body.dataset.ready = "true";
    }
    document.querySelectorAll("button[data-path]").forEach((button) => {
      button.addEventListener("click", () => render(button.dataset.path, button));
    });
    await render("../README.md", document.querySelector("button[data-path]"));
  </script>
</body>
</html>
